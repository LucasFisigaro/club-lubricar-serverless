<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Saldo - Club Lubricar</title>
    <link rel="stylesheet" href="/src/styles/styles.css">
</head>
<body class="auth-checking">

    <!-- BARRA DE NAVEGACIÓN GLOBAL -->
    <nav class="navbar-marca">
        <div class="nav-izquierda" onclick="window.location.href='/'">
            <div class="nav-logo-wrapper">
                <span class="logo-icon"></span>
                <img src="/static/images/logo_lubricar_white.png" alt="Logo Club Lubricar" class="nav-logo-png">
            </div>
            <span class="nav-titulo"></span>
        </div>

        <div class="nav-derecha">
            <a href="/" class="nav-link">🏠 Inicio</a>
            <a href="/nuevo_cliente.html" class="nav-link">👤 Nuevo Cliente</a>
            <a href="/transacciones.html" class="nav-link">⭐ Transacciones</a>
            <a href="/consulta_saldo.html" class="nav-link activo">🔍 Consultar Saldo</a>
            <a href="/listado.html" class="nav-link">📋 Listado</a>
            <span class="nav-separador"></span>
            <span id="nav-user-email" class="nav-usuario-email" title="Usuario autenticado">...</span>
            <button type="button" id="btn-logout" class="btn-logout">🚪 Salir</button>
        </div>
    </nav>

    <!-- MARCO / CONTENEDOR GENERAL PARA LAS VISTAS -->
    <div class="marco-aplicacion">
        <div class="marco-header-titulo">
            <span>Club Lubricar - Sistema de Puntos</span>
            <span id="marco-user-info" class="marco-sesion-info">Sesión activa</span>
        </div>

        <main class="contenedor-principal">
            <div class="caja">
                <!-- Botón para volver al menú principal -->
                <button type="button" id="btn-volver" class="btn-volver">
                    ⬅ Volver al Menú
                </button>

                <h2>Consultar Puntos</h2>
                <form id="form-saldo">
                    <input type="number" id="dni-busqueda" placeholder="DNI del Cliente" min="1" step="1" required>
                    <button type="submit" id="btn-buscar-saldo" class="btn-indigo">Buscar Cliente</button>
                </form>

                <div id="mensaje-error"></div>

                <!-- Caja oculta que se muestra solo cuando hay resultados -->
                <div id="caja-resultado" class="resultado">
                    <h3 id="nombre-cliente" class="nombre-cliente"></h3>
                    <div class="saldo-numero" id="saldo-cliente">0</div>
                    <span class="etiqueta-puntos">Puntos disponibles</span>

                    <div id="contenedor-historial" class="contenedor-historial">
                        <h4 class="titulo-historial">Últimos Movimientos</h4>
                        <table class="tabla-historial">
                            <thead>
                                <tr>
                                    <th>Fecha</th>
                                    <th>Motivo</th>
                                    <th>Puntos</th>
                                </tr>
                            </thead>
                            <tbody id="cuerpo-historial"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="/src/pages/consulta_saldo.ts"></script>
</body>
</html>
