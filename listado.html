<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Clientes - Club Lubricar</title>
    <link rel="stylesheet" href="/src/styles/styles.css">
</head>
<body class="auth-checking">

    <!-- BARRA DE NAVEGACIÓN GLOBAL -->
    <nav class="navbar-marca">
        <div class="nav-izquierda" onclick="window.location.href='/'">
            <div class="nav-logo-wrapper">
                <span class="logo-icon"></span>
                <img src="/static/images/logo_lubricar_white.png" alt="Logo Club Lubricar" class="nav-logo-png">
            </div>
            <span class="nav-titulo"></span>
        </div>

        <div class="nav-derecha">
            <a href="/" class="nav-link">🏠 Inicio</a>
            <a href="/nuevo_cliente.html" class="nav-link">👤 Nuevo Cliente</a>
            <a href="/transacciones.html" class="nav-link">⭐ Transacciones</a>
            <a href="/consulta_saldo.html" class="nav-link">🔍 Consultar Saldo</a>
            <a href="/listado.html" class="nav-link activo">📋 Listado</a>
            <span class="nav-separador"></span>
            <span id="nav-user-email" class="nav-usuario-email" title="Usuario autenticado">...</span>
            <button type="button" id="btn-logout" class="btn-logout">🚪 Salir</button>
        </div>
    </nav>

    <!-- MARCO / CONTENEDOR GENERAL PARA LAS VISTAS -->
    <div class="marco-aplicacion">
        <div class="marco-header-titulo">
            <span>Club Lubricar - Sistema de Puntos</span>
            <span id="marco-user-info" class="marco-sesion-info">Sesión activa</span>
        </div>

        <main class="contenedor-principal">
            <div class="caja-dashboard">

                <!-- Botones superiores -->
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
                    <button type="button" id="btn-volver" class="btn-volver" style="width: auto; margin: 0;">⬅ Volver</button>
                    <h2 class="titulo-principal" style="margin: 0;">Listado de Clientes</h2>
                    <button type="button" id="btn-exportar" class="btn-verde" style="width: auto; margin: 0; padding: 10px 20px;">⬇ Exportar a CSV</button>
                </div>

                <!-- BARRA DE BÚSQUEDA / FILTRO -->
                <div class="barra-filtros">
                    <input type="text" id="input-busqueda" placeholder="🔍 Buscar por DNI o Nombre..." autocomplete="off">
                </div>

                <div id="mensaje-carga">Cargando datos...</div>

                <!-- TABLA CON COLUMNAS ORDENABLES -->
                <table class="tabla-historial" id="tabla-clientes" style="display: none;">
                    <thead>
                        <tr>
                            <th class="col-ord" data-col="dni">DNI <span class="icono-orden" id="orden-dni">⇅</span></th>
                            <th class="col-ord" data-col="nomc">Nombre <span class="icono-orden" id="orden-nomc">⇅</span></th>
                            <th>Teléfono</th>
                            <th class="col-ord" data-col="saldo">Saldo Puntos <span class="icono-orden" id="orden-saldo">⇅</span></th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo-listado">
                        <!-- Se llena con TypeScript -->
                    </tbody>
                </table>

                <!-- BOTÓN VOLVER ARRIBA -->
                <div style="text-align: right; margin-top: 20px;">
                    <button type="button" id="btn-top" class="btn-volver" style="width: auto; display: none; padding: 8px 16px; font-size: 0.9rem;">
                        ⬆ Volver arriba
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="/src/pages/listado.ts"></script>
</body>
</html>
